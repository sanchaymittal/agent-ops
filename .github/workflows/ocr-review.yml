# AI review of pull requests, via alibaba/open-code-review.
#
# Advisory, never a gate. The gates in this repo are deterministic and local:
# the verify command and .orchestration/verify.sh. ocr calls an LLM API, so it
# can never sit inside a recorded verify command — verify.sh --run-verify
# refuses network utilities by design. Treat its comments as a second opinion
# on the PR, not as evidence; a report still needs a real acceptance check.
#
# Self-disabling: with no OCR_LLM_AUTH_TOKEN secret set, the review step is
# skipped and the job passes. A repo that has not opted in sees nothing, so
# this file never has to be deleted at install time.
#
# To turn it on:
#   gh secret set OCR_LLM_AUTH_TOKEN     # an Anthropic API key
#
# Cross-model review (docs/orchestration/models.md): the model that authored a
# change never reviews it. llm_model is pinned here, in git, so that stays
# checkable. If this repo's CODER slot is bound to a CLI running claude-opus-5,
# change llm_model to another model rather than leaving the author reviewing
# itself.

name: ocr review

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The secrets context is not readable from a job-level `if`, so the
      # opt-in check has to happen on a step, through env.
      OCR_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
    steps:
      - name: Run OpenCodeReview
        if: env.OCR_TOKEN != ''
        uses: alibaba/open-code-review@0ced7165718725e15223c3e5a506df7b7e9de51f # v1.7.17
        with:
          llm_url: https://api.anthropic.com/v1/messages
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: claude-opus-5
          llm_use_anthropic: 'true'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          sticky_summary: 'true'
          # Append-only on re-push, so a fix-up commit adds comments instead of
          # re-posting the whole review. Narrow to types:[opened] if it is noisy.
          incremental: 'true'
